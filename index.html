
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangman</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>

<body>
  <main class="game">
    <h1>Hangman</h1>

    <p>
      Choose a word to start. Guess a letter
      before the drawing is complete!
    </p>

    <div class="buttons">
      <button id="start-button" type="button">
        Choose a word / New game
      </button>
    </div>

    <svg
      class="hangman"
      viewBox="0 0 240 250"
      role="img"
      aria-label="Hangman drawing"
    >
      <path
        d="M30 230 H180 M65 230 V20 H135 V52"
        class="gallows"
      />

      <circle
        data-part="0"
        cx="135"
        cy="74"
        r="22"
      />

      <line
        data-part="1"
        x1="135"
        y1="96"
        x2="135"
        y2="160"
      />

      <line
        data-part="2"
        x1="135"
        y1="115"
        x2="100"
        y2="145"
      />

      <line
        data-part="3"
        x1="135"
        y1="115"
        x2="170"
        y2="145"
      />

      <line
        data-part="4"
        x1="135"
        y1="160"
        x2="105"
        y2="205"
      />

      <line
        data-part="5"
        x1="135"
        y1="160"
        x2="165"
        y2="205"
      />
    </svg>

    <div
      id="word-display"
      class="word"
      aria-label="Hidden word"
    >
      Choose a word to begin
    </div>

    <form id="guess-form" autocomplete="off">
      <label for="guess-input">
        Guess one letter
      </label>

      <div class="guess-row">
        <input
          id="guess-input"
          type="text"
          maxlength="1"
          inputmode="text"
          placeholder="A–Z"
          aria-describedby="message"
          disabled
        />

        <button
          id="guess-button"
          type="submit"
          disabled
        >
          Guess
        </button>
      </div>
    </form>

    <section
      class="guesses"
      aria-live="polite"
      aria-label="Guesses area"
    >
      <h2>Guesses area</h2>

      <p id="message">
        Choose a word to start playing.
      </p>

      <p>
        <strong>Previously guessed:</strong>
        <span id="guessed-letters">None</span>
      </p>

      <p>
        <strong>Wrong guesses:</strong>
        <span id="wrong-count">0</span> / 6
      </p>
    </section>
  </main>

  <dialog
    id="result-dialog"
    aria-labelledby="result-title"
  >
    <h2 id="result-title"></h2>

    <p id="result-message"></p>

    <button
      id="dialog-new-game"
      type="button"
    >
      Play again
    </button>

    <button
      id="dialog-close"
      type="button"
    >
      Close
    </button>
  </dialog>
</body>
</html>
